[project]
name = "tilden-spec"
version = "0.1.0"
description = "Schemas, conformance tooling, and a reference CLI for Tilden accessible-calling federation"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tilden = "tilden.cli:main"

[project.optional-dependencies]
dev = [
  "jsonschema[format]>=4.23,<5",
]

[tool.setuptools.packages.find]
where = ["src"]
