name: conformance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install 'jsonschema[format]>=4.23,<5'
      - name: Validate examples
        run: python tools/validate_examples.py
      - name: Validate ACE iTRS donor vectors
        run: python research/ace-itrs/mock_resolver.py
